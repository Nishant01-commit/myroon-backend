name: Deploy Backend

# Runs after "Backend CI" finishes on main. Requires a repo secret RENDER_DEPLOY_HOOK_URL —
# copy this from Render: your service -> Settings -> Deploy Hook.
on:
  workflow_run:
    workflows: ['Backend CI']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy trigger."
            echo "Add it under Settings > Secrets and variables > Actions to enable this."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
